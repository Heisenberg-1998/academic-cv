{{ $href := .Get "href" }}
{{ $label := .Get "label" }}
<div class="not-prose my-5">
  <a
    href="{{ $href | relURL }}"
    class="inline-flex items-center rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm font-medium text-gray-700 no-underline transition-colors hover:border-primary-500 hover:text-primary-600 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100 dark:hover:border-primary-400 dark:hover:text-primary-300"
  >{{ $label }}</a>
</div>
